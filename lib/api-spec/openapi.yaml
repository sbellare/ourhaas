openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
paths:
  /haas/membership:
    get:
      operationId: getMembership
      responses:
        "200":
          description: Current public membership information
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MembershipSettings" }
    put:
      operationId: updateMembership
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MembershipSettings" }
      responses:
        "200":
          description: Saved membership information
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MembershipSettings" }
        "400": { description: Invalid membership information }
        "401": { description: Sign-in required }
        "403": { description: Administrator required }
  /haas/committee:
    get:
      operationId: listCommittee
      responses:
        "200":
          description: Current committee roster in display order
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/CommitteeMember" }
  /haas/committee/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer, minimum: 1 }
    patch:
      operationId: updateCommitteeMember
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CommitteeMemberUpdate" }
      responses:
        "200":
          description: Saved committee member
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CommitteeMember" }
        "400": { description: Invalid name or identifier }
        "401": { description: Sign-in required }
        "403": { description: Administrator required }
        "404": { description: Member not found }
  /haas/events:
    get:
      operationId: listEvents
      responses:
        "200":
          description: Community events including historical dates
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/CommunityEvent" }
    post:
      operationId: createEvent
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EventInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CommunityEvent" }
  /haas/events/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer }
    put:
      operationId: updateEvent
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EventInput" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CommunityEvent" }
    delete:
      operationId: deleteEvent
      responses:
        "204": { description: Deleted }
  /haas/admin:
    get:
      operationId: getAdminStatus
      responses:
        "200":
          description: Current administrator permissions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminStatus"
  /haas/pages:
    get:
      operationId: listContentPages
      responses:
        "200":
          description: Migrated website content
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ContentPage" }
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
components:
  schemas:
    MembershipSettings:
      type: object
      additionalProperties: false
      required: [year, registrationUrl, description, calendarPolicy, chequePolicy, discountPolicy, refundPolicy]
      properties:
        year: { type: integer, minimum: 2000, maximum: 2200 }
        registrationUrl: { type: string, format: uri, maxLength: 2000 }
        description: { type: string, minLength: 1, maxLength: 2000 }
        calendarPolicy: { type: string, minLength: 1, maxLength: 1000 }
        chequePolicy: { type: string, minLength: 1, maxLength: 1000 }
        discountPolicy: { type: string, minLength: 1, maxLength: 1000 }
        refundPolicy: { type: string, minLength: 1, maxLength: 1000 }
    CommitteeMember:
      type: object
      required: [id, role, name]
      properties:
        id: { type: integer }
        role: { type: string }
        name: { type: string }
    CommitteeMemberUpdate:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 120, pattern: '^[^\r\n]+$' }
    EventInput:
      type: object
      required: [title, date, time, location, description, category]
      properties:
        title: { type: string, minLength: 1, maxLength: 200 }
        date: { type: string, pattern: '^\d{4}-\d{2}-\d{2}$' }
        time: { type: string, maxLength: 100 }
        location: { type: string, maxLength: 300 }
        description: { type: string, maxLength: 5000 }
        category: { type: string, enum: [Spiritual, Community, Cultural] }
        zeffyUrl:
          type: string
          maxLength: 2000
          pattern: '^(https://(www\.)?zeffy\.com/[^\s]*)?$'
          description: Optional HTTPS Zeffy payment or registration link for this event. Requests trim surrounding whitespace before length and pattern validation; a blank string removes the link, while omission leaves an existing link unchanged.
    CommunityEvent:
      allOf:
        - $ref: "#/components/schemas/EventInput"
        - type: object
          required: [id]
          properties:
            id: { type: integer }
    AdminStatus:
      type: object
      required: [signedIn, isAdmin]
      properties:
        signedIn: { type: boolean }
        isAdmin: { type: boolean }
    ContentPage:
      type: object
      required: [slug, title, markdown, sourceUrl]
      properties:
        slug: { type: string }
        title: { type: string }
        markdown: { type: string }
        sourceUrl: { type: string }
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

