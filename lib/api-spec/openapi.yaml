openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
paths:
  /haas/events:
    get:
      operationId: listEvents
      responses:
        "200":
          description: Community events including historical dates
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/CommunityEvent" }
    post:
      operationId: createEvent
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EventInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CommunityEvent" }
  /haas/events/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer }
    put:
      operationId: updateEvent
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EventInput" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CommunityEvent" }
    delete:
      operationId: deleteEvent
      responses:
        "204": { description: Deleted }
  /haas/admin:
    get:
      operationId: getAdminStatus
      responses:
        "200":
          description: Current administrator permissions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminStatus"
  /haas/pages:
    get:
      operationId: listContentPages
      responses:
        "200":
          description: Migrated website content
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ContentPage" }
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
components:
  schemas:
    EventInput:
      type: object
      required: [title, date, time, location, description, category]
      properties:
        title: { type: string, minLength: 1, maxLength: 200 }
        date: { type: string, pattern: '^\d{4}-\d{2}-\d{2}$' }
        time: { type: string, maxLength: 100 }
        location: { type: string, maxLength: 300 }
        description: { type: string, maxLength: 5000 }
        category: { type: string, enum: [Spiritual, Community, Cultural] }
    CommunityEvent:
      allOf:
        - $ref: "#/components/schemas/EventInput"
        - type: object
          required: [id]
          properties:
            id: { type: integer }
    AdminStatus:
      type: object
      required: [signedIn, isAdmin]
      properties:
        signedIn: { type: boolean }
        isAdmin: { type: boolean }
    ContentPage:
      type: object
      required: [slug, title, markdown, sourceUrl]
      properties:
        slug: { type: string }
        title: { type: string }
        markdown: { type: string }
        sourceUrl: { type: string }
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

